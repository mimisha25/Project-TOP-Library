<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>Library</title>
  </head>
  <body>

    <header>
      <button type="button" class="addBookBtn">Add Book</button>
  </header>

  <dialog>
    <form>
        <h2>Add Book</h2>
        <div>
            <label for="author">Author</label>
            <input type="text" id="author" name="author" value="" required>
        </div>
        <div>
            <label for="title">Title</label>
            <input type="text" id="title" name="title" value="" required>
        </div>
        <div>
            <label for="pages">Pages</label>
            <input type="number" id="pages" min="0" max="1200" value="" name="pages" required>
        </div>
        <div>
            <label for="read">Read</label>
            <input type="checkbox" id="read" value="" name="read" checked>
        </div>
        <button type="submit" class="closeDialogForm">Close</button>
    </form>
</dialog>
<div id="books-container"></div>

<script src="index.js" defer></script>
  </body>
 
</html>
